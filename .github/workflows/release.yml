name: release

# Builds the Windows exe and publishes it to the PUBLIC releases repo, so this
# repo can stay private while downloads stay open.
#
# REQUIRED SETUP (one time, done by a repo admin -- the workflow cannot do it):
#   1. Create a fine-grained Personal Access Token with
#        Repository access: nckenn/kathana-helper-releases
#        Permissions:       Contents -> Read and write
#   2. Add it to THIS repo under Settings -> Secrets and variables -> Actions
#      as a secret named RELEASE_REPO_TOKEN
#   The built-in GITHUB_TOKEN cannot be used: it only has rights to this repo.
#
# To cut a release: bump APP_VERSION in config.py, commit, then
#   git tag v3.1.1 && git push origin v3.1.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v3.1.0 or 3.1.0 (must match APP_VERSION in config.py)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REPO: nckenn/kathana-helper-releases

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Checked before the ~10 minute build, not after it. A release needs a ref
      # to attach to, so publishing into a repo with no commits uploads the
      # asset and then fails on "Repository is empty" at the very last step.
      - name: Check the releases repo is ready
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret RELEASE_REPO_TOKEN is not set on this repository. Add a fine-grained PAT with Contents:write on $RELEASE_REPO under Settings > Secrets and variables > Actions."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$RELEASE_REPO/commits?per_page=1")
          case "$code" in
            200) echo "$RELEASE_REPO is reachable and has commits." ;;
            409) echo "::error::$RELEASE_REPO has no commits. A release needs something to tag: open https://github.com/$RELEASE_REPO and add a README (Add a README file), then re-run."
                 exit 1 ;;
            401|403) echo "::error::RELEASE_REPO_TOKEN was rejected for $RELEASE_REPO (HTTP $code). Check it has Contents: Read and write and lists that repository under Repository access."
                 exit 1 ;;
            404) echo "::error::$RELEASE_REPO not found, or RELEASE_REPO_TOKEN cannot see it (HTTP 404). Check the repo name and the token's Repository access."
                 exit 1 ;;
            *) echo "::error::Unexpected HTTP $code from the GitHub API for $RELEASE_REPO."
               exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      # A tag that disagrees with APP_VERSION would ship an exe whose filename
      # and in-app version differ from the release it is published under.
      - name: Check the tag matches APP_VERSION
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          app_version=$(python -c "import config; print(config.APP_VERSION)")
          # Accept "3.1.0" or "v3.1.0"; the published tag is always v-prefixed.
          given="${tag#v}"
          if [ "$given" != "$app_version" ]; then
            echo "::error::Tag '$tag' does not match config.py, which says APP_VERSION = '$app_version'. Use 'v$app_version' (or '$app_version'), or bump APP_VERSION first."
            exit 1
          fi
          echo "tag=v$app_version"    >> "$GITHUB_OUTPUT"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      # Never publish a build whose tests do not pass.
      - name: Run tests
        run: python -m pytest -q

      - name: Build the executable
        run: pyinstaller kathana_helper.spec --noconfirm

      # The spec names it "Kathana Helper v3.1.0.exe"; GitHub turns spaces in
      # asset names into dots, so rename it for a clean download URL.
      - name: Rename the artifact
        id: artifact
        shell: bash
        run: |
          src="dist/Kathana Helper v${{ steps.version.outputs.version }}.exe"
          out="Kathana-Helper-${{ steps.version.outputs.tag }}.exe"
          if [ ! -f "$src" ]; then
            echo "::error::Expected build output not found: $src"
            ls -la dist/ || true
            exit 1
          fi
          mv "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "Built $out ($(du -h "$out" | cut -f1))"

      # The patch notes live in this private repo, so they never reach anyone
      # unless the release carries them.
      - name: Assemble the release notes
        id: notes
        shell: bash
        run: |
          body=RELEASE_BODY.md
          {
            echo "## Kathana Helper ${{ steps.version.outputs.tag }}"
            echo
            echo "Download the \`.exe\` below and run it. No installation needed."
            echo
            echo "Windows SmartScreen may warn about an unrecognised publisher --"
            echo "the build is unsigned. Choose **More info -> Run anyway**."
          } > "$body"

          notes="PATCH_NOTES_${{ steps.version.outputs.tag }}.md"
          if [ -f "$notes" ]; then
            echo "Including $notes"
            {
              echo
              echo "---"
              echo
              # Drop the file's own H1; the release already has a heading.
              tail -n +2 "$notes"
            } >> "$body"
          else
            echo "No $notes in the repo; publishing the short body only."
          fi
          echo "path=$body" >> "$GITHUB_OUTPUT"

      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kathana Helper ${{ steps.version.outputs.tag }}
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
